<svg viewBox="0 0 1400 1100" xmlns="http://www.w3.org/2000/svg">
<defs>
  <style>
    text { font-family: 'Segoe UI', Arial, sans-serif; }
    .pkg-label { font-size: 11px; font-weight: bold; }
    .cls-title-text { fill: white; font-size: 10px; font-weight: bold; text-anchor: middle; }
    .cls-attr-text { font-size: 8.5px; fill: #333; }
    .stereotype { font-size: 9px; text-anchor: middle; fill: #aaa; }
    .arrow-compose { stroke: #333; stroke-width: 1.2; fill: none; marker-end: url(#arrowhead-fill); }
    .arrow-use { stroke: #555; stroke-width: 1; fill: none; stroke-dasharray: 4,3; marker-end: url(#arrowhead); }
    .arrow-inherit { stroke: #333; stroke-width: 1.2; fill: none; marker-end: url(#arrowhead-empty); }
  </style>
  <marker id="arrowhead-fill" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#333"/>
  </marker>
  <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#555"/>
  </marker>
  <marker id="arrowhead-empty" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
    <polygon points="0 0, 9 4, 0 8" fill="white" stroke="#333" stroke-width="1"/>
  </marker>
</defs>

