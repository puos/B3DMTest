<svg viewBox="0 0 1060 1140" xmlns="http://www.w3.org/2000/svg">
<defs>
  <style>
    text { font-family: 'Segoe UI', Arial, sans-serif; }
    .obj-box { fill: #EEF3FB; stroke: #4A6FA5; stroke-width: 2; }
    .req-box { fill: #FFF3E8; stroke: #C77A30; stroke-width: 2; }
    .obj-text { font-size: 12px; font-weight: bold; fill: #1a3a6a; text-anchor: middle; }
    .req-text { font-size: 12px; font-weight: bold; fill: #8a4a10; text-anchor: middle; }
    .obj-sub { font-size: 9px; fill: #557; text-anchor: middle; }
    /* 흰색 halo 로 선 위에서도 글자가 보이도록 */
    .msg { font-size: 10px; font-weight: bold; paint-order: stroke;
           stroke: #ffffff; stroke-width: 3.5px; stroke-linejoin: round; }
    .g { fill: #1a6a1a; }
    .r { fill: #8B0000; }
    .b { fill: #1a1a8a; }
  </style>
  <marker id="ag" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0,9 3.5,0 7" fill="#1a6a1a"/>
  </marker>
  <marker id="ar" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0,9 3.5,0 7" fill="#8B0000"/>
  </marker>
  <marker id="ab" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0,9 3.5,0 7" fill="#1a1a8a"/>
  </marker>
</defs>

<rect width="1060" height="1140" fill="white"/>
<text x="30" y="28" font-size="14" font-weight="bold" fill="#222">B3DM 로딩 협력 다이어그램 — 요청 파이프라인 포함</text>

<!-- ================= Objects ================= -->
<!-- Row A (y60) -->
<rect x="40"  y="60"  width="150" height="48" rx="6" class="obj-box"/>
<text x="115" y="82"  class="obj-text">Viewer3D</text>
<text x="115" y="98"  class="obj-sub">진입점</text>

<rect x="330" y="60"  width="170" height="48" rx="6" class="obj-box"/>
<text x="415" y="82"  class="obj-text">B3dmDataSource</text>
<text x="415" y="98"  class="obj-sub">IO.DataSource</text>

<rect x="660" y="60"  width="160" height="48" rx="6" class="obj-box"/>
<text x="740" y="82"  class="obj-text">WorldGlobe</text>
<text x="740" y="98"  class="obj-sub">«Singleton»</text>

<!-- Row B (y210) -->
<rect x="300" y="210" width="240" height="48" rx="6" class="obj-box"/>
<text x="420" y="232" class="obj-text">CustomMultiTilesetBehaviour</text>
<text x="420" y="248" class="obj-sub">IO.B3DM</text>

<rect x="660" y="210" width="160" height="48" rx="6" class="obj-box"/>
<text x="740" y="232" class="obj-text">B3dmTileset</text>
<text x="740" y="248" class="obj-sub">IO.B3DM</text>

<rect x="880" y="210" width="160" height="48" rx="6" class="obj-box"/>
<text x="960" y="228" class="obj-text">B3DMLoader</text>
<text x="960" y="246" class="obj-sub">+ WebRequestLoader</text>

<!-- Row C (y370) : 요청 파이프라인 -->
<rect x="300" y="370" width="240" height="52" rx="6" class="req-box"/>
<text x="420" y="392" class="req-text">AbstractTilesetBehaviour</text>
<text x="420" y="410" class="obj-sub">ProcessTileset() — 요청 파이프라인</text>

<rect x="660" y="372" width="160" height="48" rx="6" class="req-box"/>
<text x="740" y="394" class="req-text">RequestManager</text>
<text x="740" y="410" class="obj-sub">다운로드 발행</text>

<!-- Row D (y540) -->
<rect x="60"  y="540" width="150" height="48" rx="6" class="obj-box"/>
<text x="135" y="562" class="obj-text">B3dmTile</text>
<text x="135" y="578" class="obj-sub">IO.B3DM</text>

<rect x="640" y="540" width="200" height="48" rx="6" class="obj-box"/>
<text x="740" y="562" class="obj-text">B3dmTilesetTraversal</text>
<text x="740" y="578" class="obj-sub">frustum / SSE 판정</text>

<!-- Row E (y700) -->
<rect x="60"  y="700" width="160" height="48" rx="6" class="obj-box"/>
<text x="140" y="722" class="obj-text">B3dmTileContent</text>
<text x="140" y="738" class="obj-sub">IO.B3DM</text>

<rect x="320" y="700" width="140" height="48" rx="6" class="obj-box"/>
<text x="390" y="722" class="obj-text">B3dmObject</text>
<text x="390" y="738" class="obj-sub">IO.B3DM</text>

<rect x="560" y="700" width="180" height="48" rx="6" class="obj-box"/>
<text x="650" y="722" class="obj-text">B3dmObjectManager</text>
<text x="650" y="738" class="obj-sub">«Singleton»</text>

<!-- ================= Init (green) ================= -->
<!-- 1 Viewer3D → DataSource -->
<line x1="190" y1="78" x2="330" y2="78" stroke="#1a6a1a" stroke-width="1.6" marker-end="url(#ag)"/>
<text x="200" y="73" class="msg g">1. StartTile(url)</text>

<!-- 2 Viewer3D → WorldGlobe (아래로 우회) -->
<polyline points="115,108 115,140 740,140 740,60" fill="none" stroke="#1a6a1a" stroke-width="1.6" marker-end="url(#ag)"/>
<text x="360" y="135" class="msg g">2. Initialize(view, lat, lon)</text>

<!-- 3 DataSource → CustomMulti -->
<line x1="415" y1="108" x2="420" y2="210" stroke="#1a6a1a" stroke-width="1.6" marker-end="url(#ag)"/>
<text x="424" y="165" class="msg g">3. Initialize()</text>

<!-- 4 WorldGlobe → CustomMulti -->
<line x1="690" y1="108" x2="520" y2="210" stroke="#1a6a1a" stroke-width="1.6" marker-end="url(#ag)"/>
<text x="600" y="165" class="msg g">4. owns</text>

<!-- ================= Load (red) ================= -->
<!-- 5 CustomMulti → B3dmTileset -->
<line x1="540" y1="228" x2="660" y2="228" stroke="#8B0000" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="540" y="206" class="msg r">5. AddTileset() / InitializeAsync()</text>

<!-- 6 B3dmTileset → B3DMLoader -->
<line x1="820" y1="228" x2="880" y2="228" stroke="#8B0000" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="822" y="206" class="msg r">6. LoadTilesetJson()</text>

<!-- ================= Update loop (blue) ================= -->
<!-- 7 per-frame loop on CustomMulti -->
<path d="M 300 222 C 250 222 250 250 300 250" fill="none" stroke="#1a1a8a" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#ab)"/>
<text x="120" y="232" class="msg b">7. OnUpdate() 매 프레임 ↻</text>

<!-- 8 CustomMulti → ProcessTileset -->
<line x1="420" y1="258" x2="420" y2="370" stroke="#1a1a8a" stroke-width="1.7" marker-end="url(#ab)"/>
<text x="424" y="318" class="msg b">8. ProcessTileset()</text>

<!-- 9 ProcessTileset → B3dmTileset (lateUpdate→Update) -->
<polyline points="540,388 600,388 600,258" fill="none" stroke="#1a1a8a" stroke-width="1.5" marker-end="url(#ab)"/>
<text x="545" y="383" class="msg b">9. lateUpdate → Update()</text>

<!-- 10 B3dmTileset → Traversal -->
<line x1="740" y1="258" x2="740" y2="540" stroke="#1a1a8a" stroke-width="1.5" marker-end="url(#ab)"/>
<text x="744" y="450" class="msg b">10. Traversal.Run()</text>

<!-- 11/12 Traversal → B3dmTile -->
<line x1="640" y1="558" x2="210" y2="558" stroke="#1a1a8a" stroke-width="1.5" marker-end="url(#ab)"/>
<text x="320" y="553" class="msg b">11. RequestTile()</text>
<line x1="640" y1="574" x2="210" y2="574" stroke="#1a1a8a" stroke-width="1.5" marker-end="url(#ab)"/>
<text x="320" y="588" class="msg b">12. ToggleTiles()</text>

<!-- 13 ProcessTileset → RequestManager -->
<line x1="540" y1="396" x2="660" y2="396" stroke="#8B0000" stroke-width="1.7" marker-end="url(#ar)"/>
<text x="540" y="440" class="msg r">13. RequestManager.Process()</text>

<!-- 14 RequestManager → B3dmTile -->
<polyline points="660,408 240,408 240,540" fill="none" stroke="#8B0000" stroke-width="1.7" marker-end="url(#ar)"/>
<text x="270" y="430" class="msg r">14. RequestContentAsync()</text>

<!-- 15 B3dmTile → B3DMLoader -->
<polyline points="210,545 960,545 960,258" fill="none" stroke="#8B0000" stroke-width="1.7" marker-end="url(#ar)"/>
<text x="430" y="540" class="msg r">15. LoadStream(b3dm) → GLB</text>

<!-- 16 B3dmTile → TileContent -->
<line x1="135" y1="588" x2="135" y2="700" stroke="#1a1a8a" stroke-width="1.5" marker-end="url(#ab)"/>
<text x="139" y="650" class="msg b">16. Process() / SetActive()</text>

<!-- 17 TileContent → B3dmObject -->
<line x1="220" y1="724" x2="320" y2="724" stroke="#1a1a8a" stroke-width="1.5" marker-end="url(#ab)"/>
<text x="222" y="718" class="msg b">17. BuildGeometry()</text>

<!-- 18 B3dmObject → ObjectManager -->
<line x1="460" y1="724" x2="560" y2="724" stroke="#1a1a8a" stroke-width="1.5" marker-end="url(#ab)"/>
<text x="462" y="718" class="msg b">18. Instantiate()</text>

<!-- ================= Legend ================= -->
<rect x="800" y="610" width="240" height="130" rx="6" fill="#f9f9f9" stroke="#ccc" stroke-width="1"/>
<text x="814" y="632" font-size="11" font-weight="bold" fill="#333">범례 (Legend)</text>
<line x1="814" y1="650" x2="842" y2="650" stroke="#1a6a1a" stroke-width="1.6" marker-end="url(#ag)"/>
<text x="850" y="654" font-size="10" fill="#333">초기화 (Init)</text>
<line x1="814" y1="672" x2="842" y2="672" stroke="#8B0000" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="850" y="676" font-size="10" fill="#333">로드 / 요청 (Load · Request)</text>
<line x1="814" y1="694" x2="842" y2="694" stroke="#1a1a8a" stroke-width="1.6" marker-end="url(#ab)"/>
<text x="850" y="698" font-size="10" fill="#333">업데이트 / 렌더 (Update)</text>
<line x1="814" y1="716" x2="842" y2="716" stroke="#1a1a8a" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#ab)"/>
<text x="850" y="720" font-size="10" fill="#333">반복 루프 (Per-frame)</text>

<!-- ===================================================================== -->
<!-- ============ World Origin 좌표 변환 밴드 (ECEF → 원점-상대) ============ -->
<!-- ===================================================================== -->
<line x1="30" y1="770" x2="1030" y2="770" stroke="#C77A30" stroke-width="1" stroke-dasharray="4,3"/>
<text x="30" y="795" font-size="13" font-weight="bold" fill="#8a4a10">World Origin 좌표 변환 (ECEF → 원점-상대)  ※ B3dmTile 의 BoundingVolume 이 만들어지는 경로</text>

<!-- 노드들 -->
<rect x="40"  y="815" width="170" height="48" rx="6" class="obj-box"/>
<text x="125" y="835" class="obj-text">WorldGlobe</text>
<text x="125" y="851" class="obj-sub">Initialize() → SetOrigin</text>

<rect x="300" y="815" width="200" height="48" rx="6" class="req-box"/>
<text x="400" y="835" class="req-text">Coordinates / worldContext</text>
<text x="400" y="851" class="obj-sub">WorldOrigin 저장</text>

<rect x="600" y="815" width="230" height="48" rx="6" fill="#ECF8EC" stroke="#3a8a3a" stroke-width="2"/>
<text x="715" y="835" class="obj-text" fill="#1a5a1a">ViewPort.Camera</text>
<text x="715" y="851" class="obj-sub">LookAt = 원점-상대(≈0)</text>

<rect x="300" y="905" width="240" height="48" rx="6" class="obj-box"/>
<text x="420" y="925" class="obj-text">CustomMultiTilesetBehaviour</text>
<text x="420" y="941" class="obj-sub">UpdateWorldOrigin(WorldOrigin)</text>

<rect x="640" y="905" width="190" height="48" rx="6" class="obj-box"/>
<text x="735" y="925" class="obj-text">B3dmTileset</text>
<text x="735" y="941" class="obj-sub">GetRootTransform()=worldRot</text>

<rect x="300" y="995" width="240" height="52" rx="6" class="req-box"/>
<text x="420" y="1015" class="req-text">B3dmTile.UpdateWorldOriginRight</text>
<text x="420" y="1032" class="obj-sub">pos3d = ToGeocentric(pos) − worldOrigin</text>

<rect x="300" y="1085" width="240" height="40" rx="6" class="req-box"/>
<text x="420" y="1109" class="req-text">CreateBoundingVolume → OBB.Transform</text>

<!-- 화살표 -->
<!-- B3dmTile(본문) → WorldOrigin 밴드 진입 -->
<line x1="110" y1="588" x2="110" y2="815" stroke="#1a1a8a" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#ab)"/>
<text x="114" y="700" class="msg b">W. tile 생성 시 UpdateWorldOrigin 호출</text>

<!-- W1 WorldGlobe → Coordinates -->
<line x1="210" y1="833" x2="300" y2="833" stroke="#1a6a1a" stroke-width="1.6" marker-end="url(#ag)"/>
<text x="212" y="828" class="msg g">W1. SetOrigin()</text>

<!-- W2 WorldGlobe → Camera -->
<polyline points="125,863 125,888 715,888 715,863" fill="none" stroke="#1a6a1a" stroke-width="1.6" marker-end="url(#ag)"/>
<text x="330" y="883" class="msg g">W2. Camera.LookAt = convertCoordinateToVector(원점) ≈ 0</text>

<!-- W3 Behaviour → B3dmTile -->
<line x1="420" y1="953" x2="420" y2="995" stroke="#1a1a8a" stroke-width="1.6" marker-end="url(#ab)"/>
<text x="424" y="978" class="msg b">W3. UpdateTile(root) ↻</text>

<!-- W4 B3dmTile → Coordinates GetWorldOrign -->
<polyline points="540,1010 580,1010 580,839 500,839" fill="none" stroke="#8B0000" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="548" y="980" class="msg r">W4. GetWorldOrign()</text>

<!-- W5 B3dmTile → B3dmTileset GetRootTransform -->
<polyline points="540,1005 640,960 640,953" fill="none" stroke="#8B0000" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="556" y="998" class="msg r">W5. GetRootTransform()</text>

<!-- W6 B3dmTile → CreateBoundingVolume -->
<line x1="420" y1="1047" x2="420" y2="1085" stroke="#1a1a8a" stroke-width="1.6" marker-end="url(#ab)"/>
<text x="424" y="1072" class="msg b">W6. OBB.Transform(computedTransform)</text>

<!-- Camera frame dashed to here -->
<line x1="715" y1="863" x2="715" y2="905" stroke="#3a8a3a" stroke-width="1.3" stroke-dasharray="5,3"/>

<!-- 경고 박스 -->
<rect x="600" y="995" width="430" height="130" rx="6" fill="#FFF0F0" stroke="#8B0000" stroke-width="1.3"/>
<text x="612" y="1015" font-size="11" font-weight="bold" fill="#8B0000">⚠ 현재 증상</text>
<text x="612" y="1034" class="note" font-size="9.5">정상(Unity): center (-27908, -15, 545) — 원점-상대</text>
<text x="612" y="1050" class="note" font-size="9.5">현재: center (2217719, 2304534, 5510878), |·|≈6.37e6=지구반지름</text>
<text x="612" y="1068" class="note" font-size="9.5" font-weight="bold">→ 회전만 적용·worldOrigin 차감이 OBB center 에 반영 안 됨</text>
<text x="612" y="1086" class="note" font-size="9.5">→ IntersectPlanes = OUTSIDE → 위 Traversal(10) isInclude=false</text>
<text x="612" y="1104" class="note" font-size="9.5">→ 타일 요청·렌더 전체 중단 (카메라는 원점-상대, 타일은 절대좌표)</text>

</svg>
